plugins { id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}
apply from: "../base.gradle"

android {
    buildTypes {
        debug {
            enableUnitTestCoverage true
            enableAndroidTestCoverage true
        }
    }
    namespace 'es.mrmoustard.brastlewarkcompose'

    defaultConfig {
        applicationId "es.mrmoustard.brastlewarkcompose"
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        compose true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    testOptions {
        execution 'ANDROIDX_TEST_ORCHESTRATOR'

        unitTests.returnDefaultValues = true

        unitTests.all {
            useJUnitPlatform()
        }
    }
}

dependencies {
    implementation project(':data')
    implementation project(':domain')

    implementation "androidx.core:core-ktx:1.17.0"
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation 'androidx.activity:activity-compose:1.12.3'
    implementation "androidx.compose.ui:ui:$compose_ui_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_ui_version"
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation("androidx.compose.material:material-icons-extended:1.7.8")
    implementation("io.coil-kt:coil-compose:2.7.0")
    implementation 'androidx.navigation:navigation-compose:2.9.7'

    implementation "io.arrow-kt:arrow-core:2.2.1.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"

    implementation 'com.google.dagger:hilt-android:2.59.1'
    ksp 'com.google.dagger:hilt-compiler:2.59.1'

    implementation "com.squareup.okhttp3:okhttp:5.3.2"
    implementation "com.squareup.okhttp3:logging-interceptor:5.3.2"
    implementation "com.squareup.retrofit2:retrofit:3.0.0"
    implementation "com.squareup.retrofit2:converter-moshi:3.0.0"

    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.2'
    testImplementation "org.junit.jupiter:junit-jupiter-api:6.0.2"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:6.0.2"

//    testImplementation parent.ext.test.mockito_kotlin
//    testImplementation parent.ext.test.mockito_core
//    testImplementation parent.ext.test.mockito_inline
//    testImplementation parent.ext.test.android_core_test
//    testImplementation parent.ext.test.coroutine_test
//    testImplementation 'com.squareup.retrofit2:retrofit-mock:2.9.0'

//    testImplementation 'junit:junit:4.13.2'
//
//    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
//    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
//    androidTestImplementation "androidx.compose.ui:ui-test-junit4:$compose_ui_version"
//
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_ui_version"
    debugImplementation "androidx.compose.ui:ui-test-manifest:$compose_ui_version"
}